<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>π — search inside pi</title>
<link rel="preload" href="/fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/jetbrains-mono-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas id="grid" aria-label="Digits of pi"></canvas>
<div class="fade top"></div>
<div class="fade bottom"></div>

<header id="hud">
  <div class="brand"><span class="pi">π</span><span class="total" id="total">…</span></div>
  <div class="range" id="range"></div>
  <div class="tools">
    <label class="goto" title="Jump to a position">
      <span>go to</span><input id="goto" inputmode="numeric" placeholder="#" autocomplete="off" spellcheck="false">
    </label>
    <button class="icon" id="zoomOut" title="Smaller (Ctrl + scroll)" aria-label="Smaller">A−</button>
    <button class="icon" id="zoomIn" title="Bigger (Ctrl + scroll)" aria-label="Bigger">A+</button>
    <button class="icon" id="mute" title="Sound on/off" aria-label="Toggle sound">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6 9H3v6h3l5 4z"/><g id="waves"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></g>
        <path id="slash" d="m16 9 6 6m0-6-6 6" style="display:none"/>
      </svg>
    </button>
  </div>
</header>

<div id="rail" aria-hidden="true"><div id="thumb"></div></div>

<div id="dock">
  <div id="status" role="status" aria-live="polite"></div>
  <div id="palette" hidden aria-label="Color legend: tap a color to add its digit to the search"></div>
  <form id="bar" autocomplete="off">
    <div id="modeBtn" class="mode" role="group" aria-label="Display mode">
      <button type="button" class="seg on" data-m="digits" title="Numbers" aria-label="Numbers">123</button>
      <button type="button" class="seg" data-m="letters" title="Letters" aria-label="Letters">ABC</button>
      <button type="button" class="seg col" data-m="colors" title="Colors (pi as an image)" aria-label="Colors">
        <span class="mini"><i></i><i></i><i></i><i></i></span>
      </button>
    </div>
    <input id="q" type="text" inputmode="numeric" placeholder="Type a sequence, e.g. 14159" maxlength="32"
           autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Sequence to search">
    <button type="button" id="nextBtn" class="next" hidden><span class="lbl">NEXT </span>›</button>
    <button type="submit" id="goBtn" class="go">SEARCH</button>
  </form>
  <div class="hint" id="hint"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
